# AlertmanagerConfig spec (monitoring.coreos.com/v1alpha1). Receivers OMIT their
# credential: the credential is injected into the Alertmanager pod as a file and
# exposed as an Alertmanager global.*_file (e.g. global.slack_api_url_file), so a
# credential-less slackConfigs entry inherits it. No Secret is referenced.
route:
  receiver: team-slack
  groupBy:
    - alertname
    - namespace
  groupWait: 30s
  groupInterval: 5m
  repeatInterval: 12h
  routes:
    - receiver: team-slack
      matchers:
        - name: severity
          value: critical
          matchType: "="
receivers:
  - name: team-slack
    slackConfigs:
      - channel: "#team-alerts"
        sendResolved: true
