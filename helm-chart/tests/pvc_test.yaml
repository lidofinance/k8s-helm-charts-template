suite: Test PersistentVolumeClaim template with CI Values
templates:
  - templates/pvc.yaml
values:
  - ../ci-values.yaml
release:
  namespace: test-namespace
tests:
  - it: should not render pvc if disabled
    set:
      name: data
      pvc:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0
  - it: should render pvc with values from ci-values.yaml
    asserts:
      - isKind:
          of: PersistentVolumeClaim
      # ─────────────── metadata ───────────────
      - equal:
          path: metadata.name
          value: data
      - equal:
          path: metadata.namespace
          value: test-namespace
      # ─────────────── labels ───────────────
      - isNotEmpty:
          path: metadata.labels
      # ─────────────── spec ───────────────
      - equal:
          path: spec.storageClassName
          value: longhorn-standard
      # ─────────────── access mode ───────────────
      - contains:
          path: spec.accessModes
          content: ReadWriteOnce
      # ─────────────── resources ───────────────
      - equal:
          path: spec.resources.requests.storage
          value: 100Mi
  - it: should merge per-pvc labels over global labels
    set:
      labels:
        backup.lido.fi/schedule: daily
        cost-center: infra
      pvcs:
        - name: data
          accessModes:
            - ReadWriteOnce
          size: 100Mi
          labels:
            backup.lido.fi/schedule: weekly
        - name: cache
          accessModes:
            - ReadWriteOnce
          size: 50Mi
          labels:
            backup.lido.fi/schedule: ""
    asserts:
      # per-PVC value wins over the global one
      - equal:
          path: metadata.labels["backup.lido.fi/schedule"]
          value: weekly
        documentIndex: 0
      - equal:
          path: metadata.labels["cost-center"]
          value: infra
        documentIndex: 0
      # empty per-PVC value removes the globally set key
      - notExists:
          path: metadata.labels["backup.lido.fi/schedule"]
        documentIndex: 1
      - equal:
          path: metadata.labels["cost-center"]
          value: infra
        documentIndex: 1
  - it: should render per-pvc labels without global labels
    set:
      pvcs:
        - name: data
          accessModes:
            - ReadWriteOnce
          size: 100Mi
          labels:
            backup.lido.fi/schedule: daily
    asserts:
      - equal:
          path: metadata.labels["backup.lido.fi/schedule"]
          value: daily
