{{- if .Values.deployment.enabled }}
{{- $openbaoTokenVolumeName := dig "serviceAccountToken" "volumeName" "openbao-token" .Values.openbao }}
{{- $openbaoTokenExpirationSeconds := dig "serviceAccountToken" "expirationSeconds" 3600 .Values.openbao }}
{{- $openbaoAnnotations := omit .Values.openbao.annotations "vault.hashicorp.com/agent-service-account-token-volume-name" "checksum/configmaps" }}
{{- $strategy := .Values.deployment.strategy | default dict }}
{{- $strategyType := default "RollingUpdate" $strategy.type }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    resource: deployment
    {{- include "specific.labels" . | nindent 4 }}
  {{- with .Values.deployment.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.HorizontalPodAutoscaler.enabled }}
  replicas: {{ .Values.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}
  template:
    metadata:
      labels:
        resource: deployment
        {{- include "specific.labels" . | nindent 8 }}
      {{- if or .Values.configMaps .Values.openbao.enabled }}
      annotations:
        {{- if .Values.configMaps }}
        checksum/configmaps: {{ include "chart.renderConfigMaps" . | sha256sum }}
        {{- end }}
        {{- if .Values.openbao.enabled }}
        {{- with $openbaoAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        vault.hashicorp.com/agent-service-account-token-volume-name: {{ $openbaoTokenVolumeName | quote }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      automountServiceAccountToken: {{ default false .Values.serviceAccount.automountServiceAccountToken }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsUser: {{ .Values.securityContext.runAsUser }}
        runAsGroup: {{ .Values.securityContext.runAsGroup }}
        fsGroup: {{ .Values.securityContext.fsGroup }}
        fsGroupChangePolicy: OnRootMismatch
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.initContainers }}
      initContainers:
        {{- include "chart.renderContainers" (dict "root" $ "containers" . "requireProbes" false) | nindent 8 }}
      {{- end }}
      containers:
        {{- if .Values.containers }}
        {{- include "chart.renderContainers" (dict "root" $ "containers" .Values.containers "requireProbes" true) | nindent 8 }}
        {{- end }}
      {{- if or .Values.volumes .Values.openbao.enabled }}
      volumes:
        {{- if .Values.volumes }}
        {{- include "chart.renderVolumes" (dict "volumes" .Values.volumes "default" .Values.defaultEmptyDirSizeLimit) | nindent 8 }}
        {{- end }}
        {{- if .Values.openbao.enabled }}
        - name: {{ $openbaoTokenVolumeName }}
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: {{ $openbaoTokenExpirationSeconds }}
                  audience: openbao
        {{- end }}
      {{- end }}
  strategy:
    type: {{ $strategyType }}
    {{- if eq $strategyType "RollingUpdate" }}
    rollingUpdate:
      maxSurge: {{ dig "rollingUpdate" "maxSurge" .Values.maxSurge $strategy }}
      maxUnavailable: {{ dig "rollingUpdate" "maxUnavailable" .Values.maxUnavailable $strategy }}
    {{- end }}
{{- end }}
