{{- if .Values.statefulset.enabled }}
{{- if .Values.deployment.enabled }}{{- fail "statefulset.enabled=true requires deployment.enabled=false" -}}{{- end }}
{{- $openbaoTokenVolumeName := dig "serviceAccountToken" "volumeName" "openbao-token" .Values.openbao }}
{{- $openbaoTokenExpirationSeconds := dig "serviceAccountToken" "expirationSeconds" 3600 .Values.openbao }}
{{- $openbaoAnnotations := omit .Values.openbao.annotations "vault.hashicorp.com/agent-service-account-token-volume-name" }}
{{- $containers := default .Values.containers .Values.statefulset.containers }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    resource: statefulset
    {{- include "specific.labels" . | nindent 4 }}
  {{- with .Values.statefulset.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  serviceName: {{ default .Values.name .Values.statefulset.serviceName }}
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: {{ default 5 .Values.statefulset.revisionHistoryLimit }}
  {{- with .Values.statefulset.podManagementPolicy }}
  podManagementPolicy: {{ . }}
  {{- end }}
  {{- with .Values.statefulset.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}
  template:
    metadata:
      labels:
        resource: statefulset
        {{- include "specific.labels" . | nindent 8 }}
      {{- if .Values.openbao.enabled }}
      annotations:
        {{- with $openbaoAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        vault.hashicorp.com/agent-service-account-token-volume-name: {{ $openbaoTokenVolumeName | quote }}
      {{- end }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      automountServiceAccountToken: {{ default false .Values.serviceAccount.automountServiceAccountToken }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsUser: {{ .Values.securityContext.runAsUser }}
        runAsGroup: {{ .Values.securityContext.runAsGroup }}
        fsGroup: {{ .Values.securityContext.fsGroup }}
        fsGroupChangePolicy: OnRootMismatch
      {{- with .Values.initContainers }}
      initContainers:
        {{- include "chart.renderContainers" (dict "root" $ "containers" . "requireProbes" false) | nindent 8 }}
      {{- end }}
      containers:
        {{- include "chart.renderContainers" (dict "root" $ "containers" $containers "requireProbes" true) | nindent 8 }}
      {{- if or .Values.volumes .Values.openbao.enabled }}
      volumes:
        {{- if .Values.volumes }}
        {{- include "chart.renderVolumes" (dict "volumes" .Values.volumes "default" .Values.defaultEmptyDirSizeLimit) | nindent 8 }}
        {{- end }}
        {{- if .Values.openbao.enabled }}
        - name: {{ $openbaoTokenVolumeName }}
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: {{ $openbaoTokenExpirationSeconds }}
                  audience: openbao
        {{- end }}
      {{- end }}
  {{- with .Values.statefulset.volumeClaimTemplates }}
  volumeClaimTemplates:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
