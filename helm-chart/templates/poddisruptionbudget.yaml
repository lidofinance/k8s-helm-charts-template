{{- /* Effective max pods = max of replicas and HPA maxReplicas (when HPA enabled). */ -}}
{{- $hpa := .Values.HorizontalPodAutoscaler | default dict -}}
{{- $hpaMax := 0 -}}
{{- if $hpa.enabled -}}
{{-   $hpaMax = int (default 0 $hpa.maxReplicas) -}}
{{- end -}}
{{- $replicas := int (default 1 .Values.replicas) -}}
{{- $effectiveMax := max $replicas $hpaMax -}}
{{- $pdb := .Values.PodDisruptionBudget | default dict -}}
{{- $maxUnavailable := get $pdb "maxUnavailable" -}}
{{- $minAvailable := get $pdb "minAvailable" -}}
{{- $hasMaxUnavailable := and (hasKey $pdb "maxUnavailable") (ne $maxUnavailable nil) -}}
{{- $hasMinAvailable := and (hasKey $pdb "minAvailable") (ne $minAvailable nil) -}}
{{- /* Setting both keys is a values bug; fail at render time instead of at the API. */ -}}
{{- if and $pdb.enabled $hasMaxUnavailable $hasMinAvailable -}}
{{- fail "PodDisruptionBudget: set exactly one of maxUnavailable or minAvailable, not both" -}}
{{- end -}}
{{- /* Skip the PDB entirely when the workload can never run more than one pod. */ -}}
{{- if and $pdb.enabled (gt $effectiveMax 1) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Values.name }}-pdb
  namespace: {{ .Release.Namespace }}
spec:
  {{- if $hasMaxUnavailable }}
  maxUnavailable: {{ $maxUnavailable }}
  {{- else if $hasMinAvailable }}
  minAvailable: {{ $minAvailable }}
  {{- else }}
  minAvailable: 1
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}
      resource: {{ include "chart.workloadResourceLabel" . }}
{{- end }}
