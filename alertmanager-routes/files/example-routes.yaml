# AlertmanagerConfig spec. Omit the per-receiver credential (slackConfigs with no
# apiURL) to inherit the infra-injected global.*_file; no Secret is referenced.
route:
  receiver: team-slack
  groupBy:
    - alertname
    - namespace
  groupWait: 30s
  groupInterval: 5m
  repeatInterval: 12h
  routes:
    - receiver: team-slack
      matchers:
        - name: severity
          value: critical
          matchType: "="
receivers:
  - name: team-slack
    slackConfigs:
      - channel: "#team-alerts"
        sendResolved: true
